<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="description" content="PULLUP - discover, match and join tonight's private night plans.">
  <meta name="theme-color" content="#08080B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PULLUP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PULLUP - What's the move?</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #08080b;
    }

    #pullup-loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 14px;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    #pullup-loader strong {
      font-size: 30px;
      letter-spacing: 0;
    }

    #pullup-loader img {
      width: 92px;
      height: 92px;
      margin: 0 auto 4px;
      object-fit: contain;
    }

    #pullup-loader span {
      color: #a1a1aa;
      font-size: 14px;
    }

    .pulse {
      width: 34px;
      height: 4px;
      margin: 4px auto 0;
      border-radius: 2px;
      background: #ec4899;
      animation: pulse 900ms ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { opacity: .35; transform: scaleX(.45); }
      to { opacity: 1; transform: scaleX(1); }
    }
  </style>
</head>
<body>
  <div id="pullup-loader" aria-label="Loading PULLUP">
    <img src="pullup-mark.png" alt="">
    <strong>PULLUP</strong>
    <span>What's the move?</span>
    <div class="pulse"></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('pullup-loader')?.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
