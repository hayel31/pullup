<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="description" content="PULLUP - discover, match and join tonight's private night plans.">
  <meta name="theme-color" content="#08080B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PULLUP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="preload" as="image" href="pullup-midnight-mark.png">

  <title>PULLUP - What's the move?</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #08080b;
    }

    #pullup-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      overflow: hidden;
      background: linear-gradient(180deg, #050507 0%, #08080b 58%, #101016 100%);
      opacity: 1;
      transition: opacity 220ms ease;
    }

    #pullup-loader.is-leaving {
      opacity: 0;
      pointer-events: none;
    }

    .prelude-beam {
      position: absolute;
      left: 50%;
      top: 0;
      width: min(64vw, 360px);
      height: 58vh;
      transform: translateX(-50%);
      clip-path: polygon(49.5% 0, 50.5% 0, 64% 100%, 36% 100%);
      background: linear-gradient(180deg, rgba(168, 85, 247, .02), rgba(124, 58, 237, .08) 62%, transparent 100%);
      filter: blur(12px);
      opacity: .72;
      animation: aperture-open 1100ms cubic-bezier(.16, 1, .3, 1) both;
    }

    .prelude-slit {
      position: absolute;
      left: 50%;
      top: 0;
      width: 1px;
      height: 42vh;
      transform: translateX(-50%) scaleY(0);
      transform-origin: top;
      background: linear-gradient(180deg, transparent, rgba(192, 132, 252, .42));
      box-shadow: 0 0 12px rgba(168, 85, 247, .24);
      animation: slit-descend 900ms 120ms cubic-bezier(.16, 1, .3, 1) forwards;
    }

    .preload-mark {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    @keyframes aperture-open {
      from { opacity: 0; transform: translateX(-50%) scaleX(.08); }
      to { opacity: .72; transform: translateX(-50%) scaleX(1); }
    }

    @keyframes slit-descend {
      to { transform: translateX(-50%) scaleY(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .prelude-beam,
      .prelude-slit {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="pullup-loader" aria-label="Loading PULLUP">
    <div class="prelude-beam"></div>
    <div class="prelude-slit"></div>
    <img class="preload-mark" src="pullup-midnight-mark.png" alt="">
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Remove service workers created by earlier PULLUP releases. They cached the
    // whole Flutter shell and could keep Safari on an obsolete deployment.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        registrations.forEach(function (registration) {
          registration.unregister();
        });
      });
    }

    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('pullup-loader');
      if (!loader) return;
      loader.classList.add('is-leaving');
      window.setTimeout(function () { loader.remove(); }, 260);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
