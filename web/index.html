<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="description" content="PULLUP - discover, match and join tonight's private night plans.">
  <meta name="theme-color" content="#08080B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PULLUP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="preload" as="image" href="pullup-midnight-mark.png">

  <title>PULLUP - What's the move?</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #08080b;
    }

    #pullup-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 32.5%, rgba(124, 58, 237, .2), transparent 22%),
        linear-gradient(180deg, #050507 0%, #08080b 58%, #101016 100%);
      opacity: 1;
      transition: opacity 280ms ease, transform 420ms cubic-bezier(.16, 1, .3, 1);
    }

    #pullup-loader.is-leaving {
      opacity: 0;
      transform: scale(1.015);
      pointer-events: none;
    }

    .pullup-prelude {
      position: absolute;
      left: 50%;
      top: 32.5%;
      width: 112px;
      height: 112px;
      transform: translate(-50%, -50%);
      animation: prelude-enter 800ms cubic-bezier(.16, 1, .3, 1) both;
    }

    .pullup-prelude::before,
    .pullup-prelude::after {
      content: "";
      position: absolute;
      inset: -10px;
      border: 1px solid rgba(236, 72, 153, .2);
      border-radius: 50%;
      animation: portal-breathe 2.4s ease-in-out infinite;
    }

    .pullup-prelude::after {
      inset: -24px;
      border-color: rgba(168, 85, 247, .12);
      animation-delay: -1.2s;
    }

    .pullup-prelude img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 26px rgba(236, 72, 153, .2));
    }

    .prelude-beam {
      position: absolute;
      left: 50%;
      top: calc(32.5% + 34px);
      width: min(72vw, 440px);
      height: 54vh;
      transform: translateX(-50%);
      clip-path: polygon(47% 0, 53% 0, 100% 100%, 0 100%);
      background: linear-gradient(180deg, rgba(168, 85, 247, .11), transparent 76%);
      filter: blur(14px);
      animation: beam-in 1s .18s ease-out both;
    }

    @keyframes prelude-enter {
      from { opacity: 0; transform: translate(-50%, -46%) scale(.78); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes portal-breathe {
      0%, 100% { opacity: .45; transform: scale(.96); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    @keyframes beam-in {
      from { opacity: 0; transform: translateX(-50%) scaleX(.6); }
      to { opacity: 1; transform: translateX(-50%) scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .pullup-prelude,
      .pullup-prelude::before,
      .pullup-prelude::after,
      .prelude-beam {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="pullup-loader" aria-label="Loading PULLUP">
    <div class="prelude-beam"></div>
    <div class="pullup-prelude">
      <img src="pullup-midnight-mark.png" alt="">
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Remove service workers created by earlier PULLUP releases. They cached the
    // whole Flutter shell and could keep Safari on an obsolete deployment.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        registrations.forEach(function (registration) {
          registration.unregister();
        });
      });
    }

    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('pullup-loader');
      if (!loader) return;
      loader.classList.add('is-leaving');
      window.setTimeout(function () { loader.remove(); }, 440);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
