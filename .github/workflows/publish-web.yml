name: Build and publish Flutter web

on:
  push:
    branches:
      - main
    paths-ignore:
      - "vercel-dist/**"

concurrency:
  group: flutter-web-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply pending source update
        id: source-update
        shell: bash
        run: |
          if [[ ! -f .github/pullup-update.patch.gz.b64 ]]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base64 --decode .github/pullup-update.patch.gz.b64 \
            | gzip --decompress > /tmp/pullup-update.patch
          git apply --index /tmp/pullup-update.patch
          git rm .github/pullup-update.patch.gz.b64
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build production web app
        run: >-
          flutter build web
          --release
          --pwa-strategy=none
          --no-pub
          --dart-define=APP_ENV=production
          --dart-define=USE_FIREBASE=false

      - name: Synchronize Vercel output
        run: >-
          rsync -a --delete
          --exclude=.gitignore
          --exclude=.vercel/
          --exclude=canvaskit/
          build/web/
          vercel-dist/

      - name: Publish source and generated web bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The source and Vercel bundle are already current."
            exit 0
          fi
          if [[ "${{ steps.source-update.outputs.applied }}" == "true" ]]; then
            message="feat: add event pricing and live guest mix [skip ci]"
          else
            message="build: refresh Vercel bundle [skip ci]"
          fi
          git commit -m "$message"
          git push origin HEAD:main
