<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="description" content="PULLUP - discover, match and join tonight's private night plans.">
  <meta name="theme-color" content="#08080B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PULLUP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="preload" as="image" href="pullup-midnight-mark.png">

  <title>PULLUP - What's the move?</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #08080b;
    }

    #pullup-loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      background: #08080b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    .pullup-loader-content {
      display: grid;
      justify-items: center;
      animation: pullup-enter 720ms cubic-bezier(.16, 1, .3, 1) both;
    }

    #pullup-loader strong {
      margin-top: 18px;
      font-size: 42px;
      line-height: 1;
      letter-spacing: 0;
    }

    #pullup-loader img {
      width: 128px;
      height: 128px;
      object-fit: contain;
    }

    #pullup-loader span {
      margin-top: 10px;
      color: #a1a1aa;
      font-size: 15px;
    }

    .loader-progress {
      width: 180px;
      height: 3px;
      margin-top: 46px;
      overflow: hidden;
      border-radius: 2px;
      background: #222230;
    }

    .loader-progress::after {
      content: "";
      display: block;
      width: 46%;
      height: 100%;
      border-radius: inherit;
      background: #ec4899;
      animation: pullup-progress 1.05s ease-in-out infinite;
    }

    @keyframes pullup-enter {
      from { opacity: 0; transform: translateY(18px) scale(.84); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes pullup-progress {
      from { transform: translateX(-115%); }
      to { transform: translateX(250%); }
    }
  </style>
</head>
<body>
  <div id="pullup-loader" aria-label="Loading PULLUP">
    <div class="pullup-loader-content">
      <img src="pullup-midnight-mark.png" alt="">
      <strong>PULLUP</strong>
      <span>Swipe. Match. Pull up.</span>
      <div class="loader-progress"></div>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Remove service workers created by earlier PULLUP releases. They cached the
    // whole Flutter shell and could keep Safari on an obsolete deployment.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        registrations.forEach(function (registration) {
          registration.unregister();
        });
      });
    }

    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('pullup-loader')?.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
